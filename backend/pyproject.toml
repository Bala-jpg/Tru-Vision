[project]
name = "truvision-backend"
version = "0.1.0"
description = "TruVision FastAPI backend — ISL recognition, speech, TTS, and correction services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ai = [
    "google-generativeai>=0.7.0",
    "google-cloud-texttospeech>=2.16.0",
    "faster-whisper>=1.0.0",
]
ml = [
    "tensorflow>=2.16.0",
    "numpy>=1.26.0",
]
db = [
    "supabase>=2.5.0",
]
all = [
    "truvision-backend[ai,ml,db]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
